version: '3.8'

services:
  # ------------------------------------
  # 1. Base de Datos (MySQL)
  # ------------------------------------
  db:
    image: mysql:8.0
    container_name: gestion-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE} 
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./gestion_alumnos_backup.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306" 
    restart: always
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ------------------------------------
  # 2. Backend
  # ------------------------------------
  backend:
    build: 
      context: .
    container_name: gestion-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db 
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      APP_PORT: ${APP_PORT}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules

  # ------------------------------------
  # 3. Frontend
  # ------------------------------------
  frontend:
    image: node:20-alpine
    container_name: gestion-frontend
    build:
      context: ../gestion-alumnos-frontend
      dockerfile: dockerfile.frontend 
    depends_on:
      - backend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:3000/api 
    ports:
      - "3001:3000" 
    command: npm start

  # ------------------------------------
  # 4. PhpMyAdmin
  # ------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gestion-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:80"
    restart: always

volumes:
  db_data: